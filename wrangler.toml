# Configuração espelhada para comandos Wrangler executados na raiz do repositório.
# A configuração canônica usada pelo deploy fica em cloudflare/wrangler.toml.
name = "ascensao-soberano-api"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-06"

[[r2_buckets]]
binding = "IMAGENS_R2"
bucket_name = "ascensao-soberano-imagens"

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "MonthlyAIBudget"

[exports.MonthlyAIBudget]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
