name = "ascensao-soberano-api"
main = "worker.js"
compatibility_date = "2026-11-06"

[[r2_buckets]]
binding = "IMAGENS_R2"
bucket_name = "ascensao-soberano-imagens"

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "MonthlyAIBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonthlyAIBudget"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[durable_objects.bindings]]
name = "WORLD_STATE"
class_name = "PersistentWorldState"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PersistentWorldState"]
