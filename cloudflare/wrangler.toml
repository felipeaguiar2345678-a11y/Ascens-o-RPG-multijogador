name = "ascensao-soberano-api"
main = "worker.js"
compatibility_date = "2026-11-06"

[[r2_buckets]]
binding = "IMAGENS_R2"
bucket_name = "ascensao-soberano-imagens"

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "MonthlyAIBudget"

# Estado declarativo atual: preserva o namespace SQLite existente sem reaplicar tags antigas.
[exports.MonthlyAIBudget]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Persistência global D1 criada na conta Cloudflare.
[[d1_databases]]
binding = "WORLD_STATE"
database_name = "ascensao-world-state"
database_id = "a17de1a7-8a9d-4df6-ba32-bf8ec85448a4"
migrations_dir = "migrations"
#
# Configure também o segredo WORLD_STORAGE_TOKEN com pelo menos 32 caracteres:
# npx wrangler secret put WORLD_STORAGE_TOKEN
# A credencial correspondente deve existir somente no ambiente do servidor dedicado.
