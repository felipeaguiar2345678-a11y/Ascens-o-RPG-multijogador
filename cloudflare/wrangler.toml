name = "ascensao-soberano-api"
main = "worker.js"
compatibility_date = "2026-11-06"

[[r2_buckets]]
binding = "IMAGENS_R2"
bucket_name = "ascensao-soberano-imagens"

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "MonthlyAIBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonthlyAIBudget"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Persistência global opcional (não habilitada até criar o banco e aprovar a hospedagem).
# Após criar um D1, preencha database_id e remova os comentários:
# [[d1_databases]]
# binding = "WORLD_STATE"
# database_name = "ascensao-world-state"
# database_id = "PREENCHER_COM_ID_REAL"
# migrations_dir = "migrations"
#
# Configure também o segredo WORLD_STORAGE_TOKEN com pelo menos 32 caracteres:
# npx wrangler secret put WORLD_STORAGE_TOKEN
# A credencial correspondente deve existir somente no ambiente do servidor dedicado.
