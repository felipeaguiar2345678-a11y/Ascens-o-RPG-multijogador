name: Validacao manual de integridade do projeto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch selecionada
        uses: actions/checkout@v4

      - name: Validar integridade do repositório
        run: |
          git diff --check
          test -f cloudflare/worker.js
          test -f app/src/main/java/br/com/ascensaodosoberano/MainActivity.kt
          echo "Integridade básica validada. Nenhum arquivo foi alterado ou enviado para main."
