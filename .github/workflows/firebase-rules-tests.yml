name: Testes das regras Firebase

on:
  push:
    branches:
      - main
      - feature/ai-budget-categories
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "firebase-tests/**"
      - ".github/workflows/firebase-rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "firebase-tests/**"
      - ".github/workflows/firebase-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar Java para o emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Testar regras no emulador
        run: npm run test:rules
