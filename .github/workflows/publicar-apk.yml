name: Publicar APK para download no Chrome

on:
  push:
    branches:
      - ia-historia-mundos
    paths:
      - "app/**"
      - "cloudflare/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/publicar-apk.yml"

permissions:
  contents: write

jobs:
  publicar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle :app:assembleDebug

      - name: Publicar APK para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teste-${{ github.run_number }}
          name: Ascensão do Soberano - APK de teste ${{ github.run_number }}
          body: APK de teste compilado automaticamente. Baixe o arquivo app-debug.apk diretamente no Android.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
