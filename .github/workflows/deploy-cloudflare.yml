name: Publicar Worker Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integracao-mundo-vivo
      - ia-historia-mundos
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  publicar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar serviços e testes
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Instalar Wrangler
        run: npm install --global wrangler@4.158.0 --no-audit --no-fund

      - name: Publicar Worker no Cloudflare
        run: wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verificar API, chave de IA e proteção do orçamento
        run: |
          resposta="$(curl --fail --silent --show-error https://ascensao-soberano-api.felipeaguiar2345678.workers.dev/health)"
          echo "$resposta"
          echo "$resposta" | grep -q '"status":"online"'
          echo "$resposta" | grep -q '"aiConfigured":true'
          echo "$resposta" | grep -q '"budgetGuardAvailable":true'
