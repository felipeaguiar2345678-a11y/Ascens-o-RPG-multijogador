name: Publicar Worker Cloudflare

# Publicação manual. A verificação de namespaces é somente leitura e bloqueia qualquer estado inesperado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Conferir namespaces Durable Objects antes da publicação
        run: node scripts/preflight-durable-objects.mjs
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker no Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.169.0"
          command: deploy
          workingDirectory: cloudflare
