name: Publicar Worker Cloudflare

# Publicação manual até reconciliar com segurança o histórico de migrações Durable Objects já aplicado na conta.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Publicar Worker no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare
