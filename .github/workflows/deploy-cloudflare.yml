name: Publicar Worker Cloudflare
# Publica a versão atual do Worker após alterações nas rotas Cloudflare.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integracao-mundo-vivo
      - narrativa-sem-mapa
      - atualizacao-ia-rpg-narrativo
      - biblioteca-visual-classes
      - combate-cinematico-integrado
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  publicar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e validar rotas
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run check
          npm test

      - name: Instalar Wrangler
        run: npm install --global wrangler@4.158.0 --no-audit --no-fund

      - name: Publicar Worker no Cloudflare
        run: wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verificar API, chave de IA e proteção do orçamento
        run: |
          resposta="$(curl --fail --silent --show-error https://ascensao-soberano-api.felipeaguiar2345678.workers.dev/health)"
          echo "$resposta"
          echo "$resposta" | grep -q '"status":"online"'
          echo "$resposta" | grep -q '"aiConfigured":true'
          echo "$resposta" | grep -q '"budgetGuardAvailable":true'
