name: Publicar Worker Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integracao-mundo-vivo
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  publicar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Wrangler
        run: npm install --global wrangler@4.158.0 --no-audit --no-fund

      - name: Publicar Worker no Cloudflare
        run: wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
