name: Publicar Worker Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  publicar-worker:
    # Mesmo uma execução manual só pode publicar a branch principal.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredos obrigatorios sem exibir valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Segredo CLOUDFLARE_API_TOKEN ausente." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Segredo CLOUDFLARE_ACCOUNT_ID ausente." && exit 1)

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Publicar Worker no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare
