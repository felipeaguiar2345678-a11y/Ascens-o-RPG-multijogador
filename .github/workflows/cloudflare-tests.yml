name: Cloudflare Worker Tests

on:
  push:
    branches:
      - main
      - feature/ai-budget-categories
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-tests.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes
        run: npm test
