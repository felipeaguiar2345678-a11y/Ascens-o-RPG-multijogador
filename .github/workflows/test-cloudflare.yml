name: Validar Worker Cloudflare

on:
  push:
    branches:
      - feature/ai-budget-categories
    paths:
      - "cloudflare/**"
      - ".github/workflows/test-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare/package-lock.json

      - name: Instalar dependencias de teste
        working-directory: cloudflare
        run: npm install

      - name: Verificar sintaxe JavaScript
        working-directory: cloudflare
        run: npm run check

      - name: Validar configuracao e compilacao sem publicar
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Testar reservas e liquidacoes do Durable Object
        working-directory: cloudflare
        run: npm test
