# Verificação automatizada do projeto Godot 4.7.2.
# O workflow também é validado a cada atualização desta definição.

name: Validar projeto Godot

on:
  workflow_dispatch:
  push:
    branches:
      - godot-migracao-definitiva
    paths:
      - "godot/**"
      - ".github/workflows/validar-godot.yml"

permissions:
  contents: read

# Mantém somente a validação mais recente da branch.
# Novos pushes cancelam a execução antiga e substituem a pendente,
# impedindo acúmulo de filas e consumo permanente dos runners.
concurrency:
  group: validar-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar projeto Godot 4.7.2 # suíte multiplayer, ecologia e proteção social
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Verificar compilação dos scripts críticos
        run: |
          godot --headless --path godot --check-only --script res://scripts/repositorio_grupos_criaturas_servidor.gd
          godot --headless --path godot --check-only --script res://scripts/rede_multiplayer.gd
      - name: Importar e validar projeto
        run: |
          godot --headless --editor --path godot --quit
          godot --headless --path godot --quit-after 5

      - name: Executar todos os testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          testes=(godot/tests/teste_*.gd)

          if [ "${#testes[@]}" -eq 0 ]; then
            echo "Nenhum teste foi encontrado em godot/tests."
            exit 1
          fi

          echo "Foram encontrados ${#testes[@]} testes."
          for arquivo in "${testes[@]}"; do
            nome="${arquivo#godot/tests/}"
            echo "::group::Executando ${nome}"
            log="/tmp/${nome}.log"
            if ! timeout 60s godot --headless --path godot --script "res://tests/${nome}" 2>&1 | tee "$log"; then
              echo "::error::O teste ${nome} terminou com erro ou excedeu 60 segundos."
              exit 1
            fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to (load|create|instantiate)' "$log"; then
              echo "::error::O teste ${nome} registrou erro interno do Godot."
              exit 1
            fi
            echo "::endgroup::"
          done

          echo "Todos os ${#testes[@]} testes terminaram sem erro."

      - name: Validar imagem do servidor dedicado
        run: docker build --pull -f godot/Dockerfile.servidor -t ascensao-do-soberano-servidor:ci .

