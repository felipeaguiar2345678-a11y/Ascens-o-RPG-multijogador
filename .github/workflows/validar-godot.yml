name: Validar projeto Godot
# Verificação automatizada do catálogo, persistência e regras de equipamento.

on:
  workflow_dispatch:
  push:
    branches:
      - godot-migracao-definitiva
    paths:
      - "godot/**"
      - ".github/workflows/validar-godot.yml"

permissions:
  contents: read

jobs:
  validar:
    name: Validar projeto Godot 4.7.2
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Importar e validar projeto
        run: |
          godot --headless --editor --path godot --quit
          godot --headless --path godot --quit-after 5

      - name: Testar persistência de personagem
        run: godot --headless --path godot --script res://tests/teste_persistencia.gd

      - name: Testar catálogo global de criaturas
        run: godot --headless --path godot --script res://tests/teste_catalogo_criaturas.gd

      - name: Testar seleção de encontros
        run: godot --headless --path godot --script res://tests/teste_selecao_encontros.gd

      - name: Testar evolução persistente de criaturas
        run: godot --headless --path godot --script res://tests/teste_evolucao_criaturas.gd

      - name: Testar criaturas errantes persistentes
        run: godot --headless --path godot --script res://tests/teste_criaturas_errantes.gd

      - name: Testar comportamento de criaturas
        run: godot --headless --path godot --script res://tests/teste_comportamento_criaturas.gd

      - name: Testar ecologia e territórios de criaturas
        run: godot --headless --path godot --script res://tests/teste_ecologia_criaturas.gd

      - name: Testar reprodução e equilíbrio de populações
        run: godot --headless --path godot --script res://tests/teste_populacao_criaturas.gd

      - name: Testar cuidado parental e sobrevivência de filhotes
        run: timeout 45s godot --headless --path godot --script res://tests/teste_cuidado_parental.gd

      - name: Testar recursos ambientais e dieta declarada
        run: godot --headless --path godot --script res://tests/teste_recursos_ecologicos.gd

      - name: Testar alimentação compartilhada entre grupos
        run: timeout 45s godot --headless --path godot --script res://tests/teste_alimentacao_compartilhada.gd

      - name: Testar ajuda alimentar entre aliados
        run: timeout 45s godot --headless --path godot --script res://tests/teste_ajuda_alimentar.gd

      - name: Testar carcaças e alimentação necrófaga
        run: timeout 45s godot --headless --path godot --script res://tests/teste_carcacas_ecologicas.gd

      - name: Testar migração por escassez alimentar
        run: timeout 45s godot --headless --path godot --script res://tests/teste_migracao_ecologica.gd

      - name: Testar liderança natural por grupo
        run: godot --headless --path godot --script res://tests/teste_lideres_criaturas.gd

      - name: Testar grupos e indivíduos selvagens
        run: godot --headless --path godot --script res://tests/teste_grupos_criaturas.gd

      - name: Testar movimento territorial dos grupos
        run: godot --headless --path godot --script res://tests/teste_movimento_grupos.gd

      - name: Testar combate ecológico e defesa dos líderes
        run: godot --headless --path godot --script res://tests/teste_combate_ecologico.gd
