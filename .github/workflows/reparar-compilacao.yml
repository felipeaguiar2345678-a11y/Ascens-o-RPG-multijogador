name: Validacao manual de compilacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch selecionada
        uses: actions/checkout@v4

      - name: Validar arquivos principais
        run: |
          git diff --check
          test -f app/src/main/java/br/com/ascensaodosoberano/MainActivity.kt
          test -f app/src/main/java/br/com/ascensaodosoberano/World/RepositorioCriaturas.kt
          test -f cloudflare/worker.js
          echo "Arquivos principais encontrados. Nenhuma alteração foi enviada para main."
