
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Extrair projeto ZIP
        id: locate
        run: |
          ZIP_FILE=$(find . -type f -name 'Ascensao_do_Soberano_Projeto_Android_MVP (2).zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP NÃO ENCONTRADO"
            exit 1
          fi

          echo "=== CONTEÚDO DO ZIP ==="
          unzip -Z1 "$ZIP_FILE" | head -100

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== ARQUIVOS EXTRAÍDOS ==="
          find extracted -maxdepth 5 -type f | head -100

          echo "=== PROCURANDO PACKAGE.JSON ==="
          find extracted -name package.json -print
          
          exit 1


      - name: Instalar dependências
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm install

      - name: Gerar versão web
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run build

      - name: Adicionar plataforma Android
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npx cap sync android

      - name: Compilar APK
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ascensao-do-soberano-apk
          path: ${{ steps.locate.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
