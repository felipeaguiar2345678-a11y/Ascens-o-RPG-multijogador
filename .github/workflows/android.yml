name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integracao-mundo-vivo
      - evolucao-ia-aventureiros-design
    paths:
      - "app/**"
      - "cloudflare/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "firestore.rules.test.js"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe do Worker
        run: node --check cloudflare/worker.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js para validar regras
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21 para o emulador Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar ferramentas de teste
        run: |
          npm install --global firebase-tools
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Testar permissões do Firestore no emulador
        run: firebase emulators:exec --only firestore --project demo-ascensao "npm run test:rules"

      - name: Restaurar Java 17 para o Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Executar testes unitários
        run: gradle :app:testDebugUnitTest

      - name: Compilar aplicativo
        run: gradle :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ascensao-do-soberano-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
