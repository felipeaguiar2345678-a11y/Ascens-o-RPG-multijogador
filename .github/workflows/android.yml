
name: Gerar APK Android - Novo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[auto-fix]')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Corrigir fontes e precisão dos chefes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import tempfile, os, re

          archive = Path("Ascensao_atualizado.zip")
          if not archive.exists():
              raise SystemExit("ZIP do projeto não encontrado")

          with ZipFile(archive, "r") as source:
              entries = [(info, source.read(info.filename)) for info in source.infolist()]

          def replace_exact(text, old, new, count, label):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: esperado {count}, encontrado {actual}")
              return text.replace(old, new)

          edits = {
              "MainActivity.kt": [
                  ('                TopAppBarCompat("Ascensão do Soberano")',
                   '''                Surface(tonalElevation = 3.dp) {
                    Text(
                        text = "Ascensão do Soberano",
                        style = MaterialTheme.typography.titleLarge,
                        modifier = Modifier
                            .fillMaxWidth()
                            .padding(horizontal = 16.dp, vertical = 14.dp)
                    )
                }''', 1),
                  ('''                                    if (result.enemyId != null &&
                                        result.criatura == null
                                    ) {

                                        Button(
                                            onClick = {

                                                combateFinalizado = false

                                                combat =
                                                    CombatFactory.createCombat(
                                                        hero,
                                                        result.enemyId
                                                    )

                                                if (combat != null) {

                                                    estadoMundo =
                                                        TransicaoMundo.iniciarCombate(
                                                            estadoMundo
                                                        )

                                                    message = "Combate iniciado!"

                                                } else {
                                                    message =
                                                        "Não foi possível criar o combate."
                                                }
                                            },
                                            modifier = Modifier.fillMaxWidth()
                                        ) {
                                            Text("ENFRENTAR CRIATURA")
                                        }
                                    }''',
                   '''                                    result.enemyId
                                        ?.takeIf { result.criatura == null }
                                        ?.let { enemyId ->
                                            Button(
                                                onClick = {
                                                    scope.launch {
                                                        try {
                                                            val criatura =
                                                                RepositorioCriaturas.buscarCriatura(enemyId)

                                                            if (criatura == null) {
                                                                message = "A criatura não está mais disponível no bestiário global."
                                                            } else {
                                                                combateFinalizado = false
                                                                combat = CombatFactory.createCombat(hero, criatura)
                                                                estadoMundo = TransicaoMundo.iniciarCombate(estadoMundo)
                                                                message = "Combate iniciado!"
                                                            }
                                                        } catch (e: Exception) {
                                                            message = "Não foi possível carregar a criatura: ${e.localizedMessage}"
                                                        }
                                                    }
                                                },
                                                modifier = Modifier.fillMaxWidth()
                                            ) {
                                                Text("ENFRENTAR CRIATURA")
                                            }
                                        }''', 1)
              ],
              "ExplorationSystem.kt": [
                  ("val bossChance: Int,", "val bossChance: Double,", 1),
                  ("            RegionRank.E,\n            45,\n            5,", "            RegionRank.E,\n            45,\n            5.0,", 1),
                  ("            RegionRank.C,\n            60,\n            10,", "            RegionRank.C,\n            60,\n            10.0,", 1),
                  ("            RegionRank.S,\n            75,\n            20,", "            RegionRank.S,\n            75,\n            20.0,", 1),
                  ("            RegionRank.SSS,\n            90,\n            30,", "            RegionRank.SSS,\n            90,\n            30.0,", 1)
              ],
              "CreatureApi.kt": [
                  ("bossChance: Int", "bossChance: Double", 2)
              ],
              "WorldDirector.kt": [
                  ("import kotlin.random.Random", "import kotlin.math.roundToInt\nimport kotlin.random.Random", 1),
                  ("val bossChance: Int = dangerLevel / 5,", "val bossChance: Double = dangerLevel / 5.0,", 1),
                  ("val bossChance = context.bossChance.coerceIn(0, danger)", "val bossChance = context.bossChance.coerceIn(0.0, danger.toDouble())", 1),
                  ("        val bossLimit = bossChance * 100\nval encounterLimit = danger * 100", "        val encounterLimit = danger * 100\n        val bossLimit = (bossChance * 100.0).roundToInt().coerceIn(0, encounterLimit)", 1)
              ]
          }

          output, found = [], set()
          for info, raw in entries:
              basename = info.filename.rsplit("/", 1)[-1]
              if basename in edits:
                  source_text = raw.decode("utf-8").replace("\r\n", "\n")
                  for old, new, count in edits[basename]:
                      source_text = replace_exact(source_text, old, new, count, basename + ": " + old[:35])
                  if basename == "MainActivity.kt":
                      pattern = r'(?m)^([ \t]*\})\r?\n([ \t]*\})\r?\n([ \t]*\})\r?\n([ \t]*\})\r?\n[ \t]*\r?\n([ \t]*// MULTIPLAYER)'
                      matches = list(re.finditer(pattern, source_text))
                      if len(matches) != 1:
                          pos = source_text.find("// MULTIPLAYER")
                          raise SystemExit("MainActivity.kt: fechamento do bloco de combate não encontrado. Trecho: " + repr(source_text[max(0, pos-140):pos+30]))
                      def fix_combat_call(match):
                          return match.group(1) + "\n" + match.group(2) + "\n" + match.group(3)[:-1] + ")" + "\n" + match.group(4) + "\n\n" + match.group(5)
                      source_text = re.sub(pattern, fix_combat_call, source_text, count=1)
                  raw = source_text.encode("utf-8")
                  found.add(basename)
              elif basename == "TelaMundo.kt":
                  source_text = raw.decode("utf-8").replace("\r\n", "\n")
                  pattern = r"x = \(posicaoCompanheiro\.x -\s*estado\.posicaoNoMapa\.x\) \* 64\.dp \* 13f,\s*y = \(posicaoCompanheiro\.y -\s*estado\.posicaoNoMapa\.y\) \* 64\.dp \* 21f"
                  if len(re.findall(pattern, source_text)) != 1:
                      raise SystemExit("TelaMundo.kt: deslocamento do companheiro não corresponde ao esperado")
                  source_text = re.sub(pattern, "x = 64.dp * (posicaoCompanheiro.x - estado.posicaoNoMapa.x) * 13f,\n                        y = 64.dp * (posicaoCompanheiro.y - estado.posicaoNoMapa.y) * 21f", source_text)
                  raw = source_text.encode("utf-8")
                  found.add(basename)
              elif basename == "CharacterAIGenerationMapper.kt":
                  source_text = raw.decode("utf-8").replace("\r\n", "\n")
                  if "fun fromMap(" in source_text or not source_text.endswith("\n}"):
                      raise SystemExit("CharacterAIGenerationMapper.kt: conteúdo inesperado")
                  method = '''
          
              fun fromMap(data: Map<String, Any?>): CharacterAIGeneration {
                  val status = runCatching {
                      GenerationStatus.valueOf(data["status"] as? String ?: "NOT_STARTED")
                  }.getOrDefault(GenerationStatus.NOT_STARTED)

                  return CharacterAIGeneration(
                      characterId = data["characterId"] as? String ?: "",
                      generationId = data["generationId"] as? String ?: "",
                      prompt = data["prompt"] as? String ?: "",
                      status = status,
                      imagePath = data["imagePath"] as? String ?: "",
                      imageUrl = data["imageUrl"] as? String ?: "",
                      visualVersion = (data["visualVersion"] as? Number)?.toInt() ?: 1,
                      errorMessage = data["errorMessage"] as? String ?: ""
                  )
              }
          '''
                  source_text = source_text[:-2] + method + "\n}"
                  raw = source_text.encode("utf-8")
                  found.add(basename)
              output.append((info, raw))

          required = set(edits) | {"TelaMundo.kt", "CharacterAIGenerationMapper.kt"}
          if found != required:
              raise SystemExit(f"Arquivos não encontrados no ZIP: {sorted(required - found)}")

          worker_path = Path("cloudflare/worker.js")
          worker = worker_path.read_text(encoding="utf-8")
          old = """        !Number.isFinite(bossChance) ||
        bossChance < 0 ||
        bossChance > 100 ||
        Math.round(bossChance * 100) !== bossChance * 100"""
          new = """        !Number.isFinite(bossChance) ||
        bossChance < 0 ||
        bossChance > danger ||
        Math.abs(bossChance * 100 - Math.round(bossChance * 100)) > 1e-7"""
          worker = replace_exact(worker, old, new, 1, "Validação de bossChance no Worker")

          fd, temp_name = tempfile.mkstemp(suffix=".zip")
          os.close(fd)
          try:
              with ZipFile(temp_name, "w", ZIP_DEFLATED) as target:
                  for info, raw in output:
                      target.writestr(info, raw)
              Path(temp_name).replace(archive)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)

          worker_path.write_text(worker, encoding="utf-8")
          print("Fontes corrigidas e ZIP atualizado.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ascensao_atualizado.zip cloudflare/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "[auto-fix] Corrige compilação e chance decimal dos chefes"
            git push origin HEAD:main
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair e localizar projeto
        run: |
          ZIP_FILE=$(find . -type f -name 'Ascensao_atualizado.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP nao encontrado"
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP_FILE" -d projeto

          APP_GRADLE=$(find projeto -type f -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "Projeto Android nao encontrado"
            find projeto -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR="${APP_GRADLE%/app/build.gradle.kts}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Firebase
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Configurar Java no projeto
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          if "sourceCompatibility" not in s:
              s = s.replace(
                  " buildFeatures { compose = true }",
                  """ compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  buildFeatures { compose = true }"""
              )
              p.write_text(s)
          PY

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:dependencies --configuration debugCompileClasspath
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ascensao-do-soberano-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
