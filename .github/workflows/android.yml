
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar e extrair ZIP
        run: |
          ZIP_FILE=$(find . -type f -name 'Ascensao_do_Soberano_Projeto_Android_MVP (2).zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP nao encontrado"
            exit 1
          fi

          mkdir projeto
          unzip -q "$ZIP_FILE" -d projeto

               
        - name: Configurar Firebase
        run: cp google-services.json projeto/app/google-services.json

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ascensao-do-soberano-apk
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
