name: Publicar API e persistência Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-cloudflare-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Aplicar migrations D1 e publicar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Worker e testes locais
        run: npm run check
        working-directory: cloudflare

      - name: Inspecionar e preservar namespaces Durable Objects existentes
        id: durable-objects
        run: node scripts/preflight-durable-objects.mjs
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Gerar configuração que mantém o namespace legado
        run: |
          printf '\n[exports.PersistentWorldState]\ntype = "durable-object"\nstorage = "%s"\n' "${{ steps.durable-objects.outputs.legacy_storage }}" >> wrangler.toml
        working-directory: cloudflare

      - name: Aplicar migrations no D1 remoto
        run: npx --yes wrangler@4.169.0 d1 migrations apply ascensao-world-state --remote
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker preservando o namespace antigo
        run: npx --yes wrangler@4.169.0 deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verificar saúde pública e persistência D1
        env:
          WORKER_URL: https://ascensao-soberano-api.felipeaguiar2345678.workers.dev
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 10); do
            if curl --fail --silent --show-error "${WORKER_URL}/health" -o /tmp/ascensao-health.json; then
              break
            fi
            if [ "$tentativa" -eq 10 ]; then
              echo "Worker não respondeu ao endpoint /health após 10 tentativas."
              exit 1
            fi
            sleep 3
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("/tmp/ascensao-health.json", "utf8"));
          console.log(JSON.stringify({
            status: health.status,
            worldStorageConfigured: health.worldStorageConfigured,
            worldStorageSchemaReady: health.worldStorageSchemaReady,
            worldStorageReady: health.worldStorageReady
          }, null, 2));
          if (health.status !== "online" || health.worldStorageReady !== true) {
            console.error("Health check falhou: API ou persistência global D1 não está pronta.");
            process.exit(1);
          }
          NODE
